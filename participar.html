<section class="secao contato">

<option value="Conhecer o projeto">Quero conhecer mais</option>
<option value="Outro">Outro(Insira como sugestão)</option>
</select>
<textarea id="mensagem" placeholder="Deixe uma mensagem ou sugestão"></textarea>
<button type="submit" class="botao-principal">Quero participar</button>
</form>
<p id="resultado"></p>
</section>
